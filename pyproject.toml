[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bestconsulting-ai-core"
version = "2.2.0"
description = "Единый ИИ-сотрудник Bestconsulting с GPT-оркестрацией и памятью"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Bestconsulting"}]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "alembic*"]
exclude = ["tests*", "docs*"]
